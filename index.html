<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>经典坦克大战 · 网页版</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="game-container">
      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="480" height="480"></canvas>
      </div>

      <div class="info-panel">
        <div class="panel-title">坦克大战</div>

        <div class="stat">
          <span class="stat-label">得分</span>
          <span class="stat-value" id="scoreDisplay">0</span>
        </div>

        <div class="stat">
          <span class="stat-label">生命</span>
          <span class="stat-value" id="livesDisplay">❤️ 3</span>
        </div>

        <div class="panel-buttons">
          <button id="pauseBtn">⏸ 暂停</button>
          <button id="restartBtn">🔄 重新开始</button>
          <button id="fullscreenBtn">⛶ 全屏</button>
          <button id="soundBtn">🔊 音效</button>
        </div>

        <div class="panel-hint">
          <p><b>操作</b></p>
          <p>↑↓←→ / WASD 移动</p>
          <p>空格 射击</p>
          <p>P / Esc 暂停</p>
        </div>

        <!-- 移动端虚拟按键（窄屏时显示在画布下方） -->
        <div class="mobile-controls" id="mobileControls">
          <div class="dpad">
            <button class="ctrl-btn" data-key="ArrowUp">▲</button>
            <div class="dpad-row">
              <button class="ctrl-btn" data-key="ArrowLeft">◀</button>
              <button class="ctrl-btn" data-key="ArrowDown">▼</button>
              <button class="ctrl-btn" data-key="ArrowRight">▶</button>
            </div>
          </div>
          <div class="action-pad">
            <button class="ctrl-btn fire-btn" data-key="Space">🔥</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 按依赖顺序加载 -->
    <script src="js/sound.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/map.js"></script>
    <script src="js/player.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/bullet.js"></script>
    <script src="js/explosion.js"></script>
    <script src="js/powerup.js"></script>
    <script src="js/render.js"></script>
    <script src="js/input.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
